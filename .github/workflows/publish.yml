name: Publish to NPM

on:
  push:
    tags: ["v*"]

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Setup Node (for npm auth & publish)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Update npm (for trusted publishing >=11.5.1)
        run: npm install --global npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Verify package contents
        run: bun pm pack --dry-run

      - name: Publish to npm registry
        run: |
          npm pkg delete devDependencies
          npm publish --access public --provenance

      - name: Post npm publish
        run: |
          git checkout -- package.json
          echo "node version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "bun version: $(bun --revision)"
          echo "tguard-js v$(jq -r .version package.json) published to npm"
